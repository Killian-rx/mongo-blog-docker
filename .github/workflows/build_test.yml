name: Build and Test Application
on: 
  push:
    branches: [activite2]
  pull_request:
    branches: [activite2]

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build image for server
        run: docker build -t mongo-blog-docker-api:1.0.0 -f api/Dockerfile .

      - name: Build image for mongo
        run: docker build -t mongo-blog-docker-mongo:1.0.0 -f mongo/Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: mongo-blog-docker-api:1.0.0
          file: api/Dockerfile
          only-severities: critical, high
          exit-code: false

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: mongo-blog-docker-mongo:1.0.0
          file: mongo/Dockerfile
          only-severities: critical, high
          exit-code: false
          
  docker-compose:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build the stack
        run: docker compose up -d
